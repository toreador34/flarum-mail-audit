toreador-flarum-mail-audit:
  admin:
    nav:
      mail_audit: E-posta Denetimi
      title: Forumdan çıkan tüm e-postaları incele

    settings:
      open_list_button: E-posta denetim listesini aç
      open_list_help: |
        Gönderilen her e-posta ayrı bir sayfada listelenir; böylece siz bu
        ayarları değiştirirken liste kullanılabilir kalır. Aynı sayfaya admin
        sol menüsündeki "E-posta Denetimi" bağlantısından da ulaşabilirsiniz.
      enabled_label: Giden e-postaları kaydet
      enabled_help: |
        Etkinleştirildiğinde, posta sürücüsüne verilen her e-posta
        gönderilmeden önce veritabanına kaydedilir (gönderen, alıcılar, konu,
        başlıklar ve aşağıdaki ayarlara göre gövde). Kaydı hemen durdurmak
        için devre dışı bırakın.
      capture_body_label: Mesaj gövdelerini sakla
      capture_body_help: |
        Etkinleştirildiğinde, e-posta gövdeleri (HTML ve düz metin) saklanır;
        hangi maillerin gövdelerinin saklanacağını aşağıdaki "Gövde kapsamı"
        ayarı belirler. Kişisel veri minimizasyonu için varsayılan olarak
        yalnızca çekirdek otomatik maillerin gövdeleri tutulur. Yalnızca üst
        veriyi saklamak için bunu devre dışı bırakın.
      body_scope_label: Gövde kapsamı
      body_scope_help: |
        "Yalnızca çekirdek otomatik mailler" seçildiğinde, gövdeler sadece
        Flarum'un kendi ürettiği bildirim, şifre sıfırlama ve e-posta
        doğrulama gibi otomatik maillerde saklanır; diğer eklentilerin
        gönderdiği e-postalarda yalnızca üst veri kaydedilir. Tespit, çekirdek
        eklentinin eklediği `List-Unsubscribe` başlığı ve `/reset`, `/confirm`
        bağlantı kalıplarına dayanır (kesin ayrım garanti edilemez).
      body_scope_system: Yalnızca çekirdek otomatik mailler (önerilen)
      body_scope_all: Tüm giden mailler
      redact_tokens_label: Bağlantı ve jetonları maskele
      redact_tokens_help: |
        Etkinleştirildiğinde, kaydedilen gövde ve başlıklardaki tek
        kullanımlık erişim bağlantıları ve jetonları (şifre sıfırlama,
        e-posta doğrulama, bildirim aboneliğinden çıkma) [redacted] ile
        değiştirilir. Veritabanı sızıntısı hâlinde hesapların ele
        geçirilmesini engeller. Hata ayıklama için tam içerik gerekiyorsa
        geçici olarak devre dışı bırakabilirsiniz.
      retention_enabled_label: Otomatik saklama silmeyi etkinleştir
      retention_enabled_help: |
        Etkinleştirildiğinde, aşağıda girilen günden eski kayıtlar günlük
        `mail-audit:prune` görevi tarafından otomatik silinir. Saklamayı
        süresiz durdurmak için devre dışı bırakın; yine de denetim
        sayfasından silmeyi elle çalıştırabilirsiniz.
      retention_days_label: Saklama süresi (gün)
      retention_days_help: |
        Otomatik silme etkinken bu günden eski kayıtlar silinir. Varsayılan:
        30. Silmenin düzenli çalışması için Flarum zamanlayıcısının (cron)
        çalışıyor olması gerekir; dilediğiniz an denetim sayfasındaki "Şimdi
        uygula" düğmesini de kullanabilirsiniz.
      privacy_label: Gizlilik politikası taslağı
      privacy_help: |
        Aşağıdaki metin, gizlilik politikanıza veya aydınlatma metninize
        ekleyebileceğiniz bir taslaktır; köşeli parantezli alanları forum
        bilgilerinizle doldurun. Metin; gövde kapsamı ve saklama süresi
        ayarlarınıza göre otomatik olarak uyarlanır. Bu taslak hukuki
        danışmanlık yerine geçmez; yayınlamadan önce bir uzmana inceletmeniz
        önerilir.
      privacy_copy: Taslağı kopyala
      privacy_copied: Taslak panoya kopyalandı.
      privacy_retention_on: |
        Kayıtlar, amaç için gerekli olan azami {days} gün saklanır ve süre
        sonunda otomatik olarak silinir.
      privacy_retention_off: |
        Kayıtlar; ilgili kişinin silme talebi veya veri sorumlusunun
        periyodik imha işlemiyle silinir.
      privacy_body_system: |
        Mesaj gövdeleri yalnızca Flarum'un kendi otomatik bildirim ve hesap
        işlem e-postalarında (ör. yeni bildirim, şifre sıfırlama, e-posta
        doğrulama) ve yalnızca teknik ihtiyaç hâlinde kaydedilir; bu
        gövdelerdeki erişim bağlantıları ve jetonlar kaydedilmeden önce
        otomatik olarak maskelenir. Diğer eklentiler aracılığıyla gönderilen
        e-postalarda mesaj gövdesi kaydedilmez.
      privacy_body_all: |
        Mesaj gövdeleri (HTML ve düz metin) kaydedilir; gövdelerdeki erişim
        bağlantıları ve jetonlar kaydedilmeden önce otomatik olarak
        maskelenir.
      privacy_body_none: |
        Mesaj gövdeleri kaydedilmez; yalnızca üst veriler (adresler, konu,
        teknik başlıklar) saklanır.
      privacy_draft: |
        GİDEN E-POSTA KAYITLARI HAKKINDA AYDINLATMA

        Veri Sorumlusu: [FORUM ADI / TÜZEL KİŞİ ADI]
        İletişim: [E-POSTA ADRESİ]

        Forumumuz; gönderilen e-postaların teknik doğrulamasını yapmak,
        teslim edilebilirliği izlemek, arızaları tespit etmek ve bilgi
        güvenliğini sağlamak amacıyla giden e-postaları kayıt altına alır.
        Kayıtlar; gönderen ve alıcı e-posta adresleri ile görünen adları, konu
        satırı, teknik e-posta başlıkları, gönderim durumu ve varsa hata
        bilgisini içerir. {body}

        İşleme faaliyeti, 6698 sayılı KVKK m. 5/2-f (meşru menfaat) ve GDPR
        m. 6(1)(f) kapsamında; temel hak ve özgürlüklerinize zarar vermemek ve
        ölçülülük ilkesine uygun olarak yürütülür. Kayıtlar üçüncü kişilerle
        paylaşılmaz, yurt dışına aktarılmaz.

        SAKLAMA SÜRESİ
        {retention}

        ÖZEL NİTELİKLİ KİŞİSEL VERİLER
        E-posta içerikleri, istenmeden özel nitelikli kişisel veri (sağlık,
        din, etnik köken, biyometrik veri vb.) içerebilir. Bu tür veriler
        yalnızca yukarıda açıklanan kayıt tutma amacıyla sınırlı olarak ve
        aşağıdaki açık rızanız kapsamında işlenir; başka hiçbir amaçla
        kullanılmaz. Forumu kullanmanız veya üye olmanız hâlinde, giden
        e-postalara ilişkin teknik kayıtların yukarıdaki kapsamda tutulmasına
        ve bu kayıtlarda yer alabilecek özel nitelikli kişisel verilerin
        işlenmesine açık rıza verdiğinizi kabul etmiş sayılırsınız. Açık
        rızanızı dilediğiniz zaman [E-POSTA ADRESİ] üzerinden geri
        çekebilirsiniz; bu hâlde ilgili kayıtlar silinir.

        HAKLARINIZ
        KVKK m. 11 ve GDPR kapsamında; kişisel verilerinizin işlenip
        işlenmediğini öğrenme, işlenmişse buna ilişkin bilgi talep etme,
        düzeltilmesini, silinmesini veya anonim hâle getirilmesini isteme ile
        işlemeye itiraz etme haklarına sahipsiniz. Talepleriniz için
        [E-POSTA ADRESİ] adresine başvurabilirsiniz.

